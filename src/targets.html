<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Lazy Coder — Where to send</title>
    <link rel="stylesheet" href="targets.css" />
  </head>
  <body>
    <header class="win-header">
      <div>
        <h1 data-i18n="targets.title">Where to send</h1>
        <p class="subtitle" data-i18n="targets.subtitle">
          Cursor chat from the list or a normal field. On/off — on the card strip
        </p>
      </div>
      <button type="button" class="primary-btn" id="btn-done" data-i18n="targets.done">Done</button>
    </header>

    <main class="targets-main">
      <div class="targets-toolbar">
        <button type="button" class="pick-btn" id="btn-pick" data-i18n-title="targets.fieldTitle" title="Add a normal input field">
          <span class="pick-icon" aria-hidden="true">⊕</span>
          <span class="pick-label" data-i18n="targets.field">Field</span>
        </button>
        <button type="button" class="pick-btn" id="btn-pick-agent" data-i18n-title="targets.chatTitle" title="Cursor chat list">
          <span class="pick-icon" aria-hidden="true">⇄</span>
          <span class="pick-label" data-i18n="targets.chat">Cursor chat</span>
        </button>
        <button type="button" class="link-btn" id="btn-uia-diag" data-i18n="targets.diag" data-i18n-title="targets.diagTitle" title="Check Cursor connection">Diagnostics</button>
        <div class="bulk-actions">
          <button type="button" class="link-btn" id="btn-all" data-i18n="targets.all">All</button>
          <span class="sep">·</span>
          <button type="button" class="link-btn" id="btn-none" data-i18n="targets.none">None</button>
        </div>
      </div>

      <div id="targets-list" class="targets-list"></div>

      <footer class="targets-footer">
        <label class="check">
          <input type="checkbox" id="auto-enter" />
          <span data-i18n="targets.autoEnter">Enter after paste</span>
        </label>
        <span class="count" id="target-count"></span>
      </footer>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="i18n.js"></script>
    <script src="targets.js"></script>
  </body>
</html>
