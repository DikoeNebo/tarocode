<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Pick</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(8, 4, 16, 0.18);
        cursor: crosshair;
        user-select: none;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .hint {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(18, 12, 28, 0.92);
        border: 1px solid rgba(232, 197, 122, 0.45);
        color: #f5ead6;
        font-size: 14px;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        white-space: nowrap;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hint kbd {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid rgba(232, 197, 122, 0.4);
      }
      .reticle {
        position: fixed;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border: 2px solid rgba(232, 197, 122, 0.85);
        border-radius: 50%;
        pointer-events: none;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35),
          inset 0 0 12px rgba(232, 197, 122, 0.2);
      }
      .reticle::before,
      .reticle::after {
        content: "";
        position: absolute;
        background: rgba(232, 197, 122, 0.9);
      }
      .reticle::before {
        left: 50%;
        top: 4px;
        bottom: 4px;
        width: 1px;
        transform: translateX(-50%);
      }
      .reticle::after {
        top: 50%;
        left: 4px;
        right: 4px;
        height: 1px;
        transform: translateY(-50%);
      }
      body.phase-focus .reticle {
        border-color: rgba(201, 168, 255, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="hint" id="hint" data-i18n-html="pick.hintField">
      Click the chat <strong>input field</strong> · <kbd>Esc</kbd> — cancel
    </div>
    <div class="reticle" id="reticle"></div>
    <script src="i18n.js"></script>
    <script src="pick.js"></script>
  </body>
</html>
