<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: app:"
    />
    <title>Keycode</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="tarot-picker.css" />
  </head>
  <body class="dock-right side-layout-table cards-only booting">
    <div id="app">
      <div class="deck-edge">
        <div class="deck-cluster" id="deck-cluster">
          <div class="deck-col">
            <header class="titlebar deck-hub" data-i18n-aria="deck.controlsAria" aria-label="Controls">
              <nav class="corner-dock" id="corner-dock">
                <button
                  type="button"
                  class="corner-btn"
                  id="btn-corner-hide"
                  data-i18n-title="deck.hideTitle"
                  data-i18n-aria="deck.hideAria"
                  title="Hide"
                  aria-label="Hide deck"
                >
                  <span aria-hidden="true">👁</span>
                </button>
                <button
                  type="button"
                  class="corner-btn"
                  id="btn-corner-help"
                  data-i18n-title="deck.help"
                  data-i18n-aria="deck.helpAria"
                  title="Quick start"
                  aria-label="Quick start"
                >
                  <span aria-hidden="true">?</span>
                </button>
                <button
                  type="button"
                  class="corner-btn"
                  id="btn-corner-settings"
                  data-i18n-title="deck.settings"
                  data-i18n-aria="deck.settings"
                  title="Settings"
                  aria-label="Settings"
                >
                  <span aria-hidden="true">⚙</span>
                </button>
                <button
                  type="button"
                  class="corner-btn corner-btn-cdp"
                  id="btn-corner-cdp"
                  data-i18n-title="deck.cdpTitle"
                  data-i18n-aria="deck.cdpAria"
                  title="Launch Cursor with CDP"
                  aria-label="Cursor CDP"
                >
                  <span aria-hidden="true">◎</span>
                </button>
                <button
                  type="button"
                  class="corner-btn corner-btn-targets"
                  id="btn-corner-targets"
                  data-i18n-title="deck.targets"
                  data-i18n-aria="deck.targetsAria"
                  title="Chats"
                  aria-label="Chats"
                >
                  <span aria-hidden="true">💬</span>
                  <span class="target-badge hidden" id="target-badge"></span>
                </button>
                <button
                  type="button"
                  class="corner-btn corner-btn-danger"
                  id="btn-corner-quit"
                  data-i18n-title="deck.quit"
                  data-i18n-aria="deck.quitAria"
                  title="Close"
                  aria-label="Quit"
                >
                  <span aria-hidden="true">✕</span>
                </button>
              </nav>
              <div
                class="strip-deck-pager"
                id="deck-pager"
                role="group"
                data-i18n-aria="deck.pagerAria"
                aria-label="Deck switcher"
              >
                <button
                  type="button"
                  class="deck-page-btn"
                  id="btn-deck-prev"
                  data-i18n-title="deck.prevDeck"
                  data-i18n-aria="deck.prevDeck"
                  title="Previous deck"
                  aria-label="Previous deck"
                >
                  <span aria-hidden="true">‹</span>
                </button>
                <span class="deck-page-name" id="deck-page-name" title="">—</span>
                <button
                  type="button"
                  class="deck-page-btn"
                  id="btn-deck-next"
                  data-i18n-title="deck.nextDeck"
                  data-i18n-aria="deck.nextDeck"
                  title="Next deck"
                  aria-label="Next deck"
                >
                  <span aria-hidden="true">›</span>
                </button>
              </div>
              <button
                type="button"
                class="phase-next hidden"
                id="btn-phase-next"
                hidden
              ></button>
              <div
                class="dest-bar hidden"
                id="dest-bar"
                role="group"
                data-i18n-aria="dest.barAria"
                aria-label="Where cards go"
              >
                <div class="dest-bar-main">
                  <div class="dest-presets" id="dest-presets"></div>
                  <div class="dest-chips" id="dest-chips"></div>
                </div>
                <button
                  type="button"
                  class="dest-prune hidden"
                  id="btn-dest-prune"
                  data-i18n-title="dest.removeOthers"
                  data-i18n-aria="dest.removeOthers"
                  title="Remove other chats"
                  aria-label="Remove other chats"
                >💀</button>
                <button
                  type="button"
                  class="dest-new-chat"
                  id="btn-new-chat"
                  data-i18n-title="deck.chatNew"
                  data-i18n-aria="deck.chatNew"
                  title="New Cursor chat"
                  aria-label="New Cursor chat"
                >+</button>
                <button
                  type="button"
                  class="dest-cards-toggle"
                  id="btn-cards-toggle"
                  data-i18n-title="deck.cardsHide"
                  data-i18n-aria="deck.cardsHide"
                  title="Hide cards"
                  aria-label="Hide cards"
                  aria-pressed="true"
                >
                  <span aria-hidden="true">▦</span>
                </button>
                <button
                  type="button"
                  class="dest-transcript-toggle"
                  id="btn-transcript-toggle"
                  data-i18n-title="deck.transcriptHide"
                  data-i18n-aria="deck.transcriptHide"
                  title="Hide chat"
                  aria-label="Hide chat"
                  aria-pressed="true"
                >
                  <span aria-hidden="true">▴</span>
                </button>
              </div>
            </header>
            <div
              class="deck-transcript hidden"
              id="deck-transcript"
              aria-live="polite"
              data-i18n-aria="deck.transcriptAria"
              aria-label="Chat messages"
            >
              <p class="deck-transcript-empty" id="deck-transcript-empty" data-i18n="deck.transcriptPick">
                Pick a chat above to see its messages
              </p>
              <div class="deck-transcript-msgs" id="deck-transcript-msgs"></div>
              <div class="deck-chat-controls hidden" id="deck-chat-controls">
                <div class="deck-clarifications hidden" id="deck-clarifications"></div>
                <div class="deck-composer-toolbar">
                  <label class="deck-mode-wrap">
                    <span class="sr-only" data-i18n="deck.chatMode">Mode</span>
                    <select
                      id="deck-mode"
                      class="deck-mode-select"
                      data-i18n-aria="deck.chatMode"
                      aria-label="Mode"
                    >
                      <option value="agent">Agent</option>
                      <option value="plan">Plan</option>
                      <option value="ask">Ask</option>
                      <option value="debug">Debug</option>
                    </select>
                  </label>
                  <label class="deck-model-wrap">
                    <span class="sr-only" data-i18n="deck.chatModel">Model</span>
                    <span
                      id="deck-model"
                      class="deck-model-label"
                      data-i18n-aria="deck.chatModel"
                      aria-label="Model"
                      title=""
                    >—</span>
                  </label>
                </div>
                <label class="sr-only" for="deck-composer-input" data-i18n="deck.chatMessage">Message</label>
                <div class="deck-composer-shell">
                  <textarea
                    id="deck-composer-input"
                    rows="2"
                    maxlength="20000"
                    data-i18n-placeholder="deck.chatPlaceholder"
                    placeholder="Type a command…"
                  ></textarea>
                  <div class="deck-composer-footer">
                    <span class="deck-composer-status" id="deck-composer-status" data-i18n="deck.chatReady">Enter to send</span>
                    <div class="deck-composer-actions">
                      <label
                        class="deck-dictate-auto"
                        data-i18n-title="deck.dictateAutoSendTitle"
                        title="Send right after dictation"
                      >
                        <input
                          type="checkbox"
                          id="deck-dictate-auto-send"
                          data-i18n-aria="deck.dictateAutoSendTitle"
                          aria-label="Send right after dictation"
                        />
                        <span data-i18n="deck.dictateAutoSend">Send</span>
                      </label>
                      <button
                        type="button"
                        class="deck-mic"
                        id="btn-deck-mic"
                        data-i18n-title="deck.chatMicTitle"
                        data-i18n-aria="deck.chatMicTitle"
                        title="Dictate"
                        aria-label="Dictate"
                        aria-pressed="false"
                      >🎤</button>
                      <button type="button" class="deck-send" id="btn-deck-send">Send</button>
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="deck-transcript-resize"
                id="deck-transcript-resize"
                role="separator"
                aria-orientation="horizontal"
                data-i18n-title="deck.transcriptResize"
                title="Drag to resize"
              ></div>
            </div>
            <div class="deck-manual-bar hidden" id="deck-manual-bar">
              <button
                type="button"
                class="deck-manual-toggle"
                id="btn-deck-manual"
                data-i18n-title="deck.manualShow"
                data-i18n-aria="deck.manualShow"
                title="Manual typing"
                aria-label="Manual typing"
                aria-pressed="false"
              >
                <span class="deck-manual-icon" aria-hidden="true">⌨</span>
                <span class="deck-manual-label" data-i18n="deck.manualShow">Manual typing</span>
              </button>
            </div>
            <section
              class="cards-zone"
              id="cards-zone"
              data-i18n-aria="deck.tableAria"
              aria-label="Tarot cards"
            >
              <div id="cards" class="cards"></div>
            </section>
          </div>
        </div>
      </div>

      <div id="toast" class="toast hidden" role="status"></div>
      <div id="cdp-nudge" class="cdp-nudge hidden" role="dialog" aria-modal="true" aria-labelledby="cdp-nudge-text">
        <div class="cdp-nudge-card">
          <p class="cdp-nudge-text" id="cdp-nudge-text"></p>
          <button type="button" class="primary-btn cdp-nudge-launch" id="cdp-nudge-action" data-i18n="cdp.launchBtn">
            Launch Cursor with CDP
          </button>
          <button type="button" class="ghost-btn" id="cdp-nudge-dismiss" data-i18n="cdp.dismiss">
            Later
          </button>
        </div>
      </div>
      <div id="card-preview" class="card-preview hidden" aria-hidden="true"></div>
      <div id="onboarding" class="onboarding hidden" role="dialog" aria-labelledby="onboarding-step-title">
        <div class="onboarding-hole" id="onboarding-hole" aria-hidden="true"></div>
        <div class="onboarding-card" id="onboarding-card">
          <div class="onboarding-arrow" id="onboarding-arrow" aria-hidden="true"></div>
          <div class="onboarding-top">
            <span class="onboarding-kicker" data-i18n="onboarding.title">Quick start</span>
            <button type="button" class="onboarding-skip" id="onboarding-skip" data-i18n="onboarding.skip">Skip</button>
          </div>
          <img id="onboarding-art" class="onboarding-art hidden" alt="" />
          <h2 id="onboarding-step-title"></h2>
          <div class="onboarding-body" id="onboarding-body"></div>
          <div class="onboarding-dots" id="onboarding-dots" role="tablist" aria-label="Steps"></div>
          <button type="button" class="primary-btn onboarding-next-btn" id="onboarding-next" data-i18n="onboarding.next">Next</button>
        </div>
      </div>
    </div>

    <div id="modal-card" class="modal hidden">
      <div class="modal-card wide">
        <h2 data-i18n="cardModal.title">Card</h2>
        <div class="form-grid">
          <label class="field block">
            <span data-i18n="cardModal.heading">Title</span>
            <input type="text" id="card-title" maxlength="40" />
          </label>
          <label class="field block">
            <span data-i18n="cardModal.short">Short on card</span>
            <input type="text" id="card-desc" maxlength="80" />
          </label>
          <label class="field block">
            <span data-i18n="cardModal.hotkey">Hotkey</span>
            <select id="card-hotkey">
              <option value="">—</option>
              <option>F1</option>
              <option>F2</option>
              <option>F3</option>
              <option>F4</option>
              <option>F5</option>
              <option>F6</option>
              <option>F7</option>
              <option>F8</option>
            </select>
          </label>
        </div>
        <label class="field block card-prompt-field">
          <span data-i18n="cardModal.prompt">Prompt (pasted into chat)</span>
          <textarea id="card-prompt" rows="10"></textarea>
        </label>
        <details class="card-tarot-details">
          <summary data-i18n="cardModal.tarot">Tarot card</summary>
          <div id="card-image" class="tarot-picker" role="listbox" data-i18n-aria="cardModal.tarot" aria-label="Tarot card"></div>
        </details>
        <div class="modal-actions">
          <button type="button" class="danger-btn" id="card-delete" data-i18n="cardModal.delete">Delete</button>
          <div class="spacer"></div>
          <button type="button" class="ghost-btn" id="card-cancel" data-i18n="cardModal.cancel">Cancel</button>
          <button type="button" class="primary-btn" id="card-save" data-i18n="cardModal.save">Save</button>
        </div>
      </div>
    </div>

    <div id="modal-quit" class="modal hidden">
      <div class="modal-card quit-card">
        <h2 data-i18n="quit.title">Is this the end?</h2>
        <div class="quit-actions">
          <button type="button" class="primary-btn" id="quit-return" data-i18n="quit.exit">Yes, quit the app</button>
          <button type="button" class="ghost-btn" id="quit-stay" data-i18n="quit.minimize">No, minimize to background</button>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="tarot.js"></script>
    <script src="app.js"></script>
  </body>
</html>
