<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#120a1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>TaroCode Remote</title>
    <link rel="stylesheet" href="remote.css?v=20260905d" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◈</span>
        <div class="brand-text">
          <h1 id="app-title">Keycode</h1>
          <p class="backend-badge" id="backend-badge" hidden></p>
          <div
            class="deck-pager"
            id="deck-pager"
            role="group"
            aria-label="Deck switcher"
          >
            <button
              type="button"
              class="deck-page-btn"
              id="btn-deck-prev"
              title="Previous deck"
              aria-label="Previous deck"
            >
              <span aria-hidden="true">‹</span>
            </button>
            <p class="deck-name" id="deck-name">—</p>
            <button
              type="button"
              class="deck-page-btn"
              id="btn-deck-next"
              title="Next deck"
              aria-label="Next deck"
            >
              <span aria-hidden="true">›</span>
            </button>
          </div>
          <button type="button" class="phase-next hidden" id="btn-phase-next" hidden></button>
        </div>
      </div>
      <div class="status-group">
        <div class="status" id="status" data-state="idle" role="status">…</div>
        <button
          type="button"
          class="sound-toggle"
          id="sound-toggle"
          title="Completion sound"
          aria-label="Completion sound"
          aria-pressed="true"
        >🔊</button>
      </div>
    </header>

    <section class="target-bar" id="target-bar">
      <button
        type="button"
        class="chat-pick-btn"
        id="btn-chat-pick"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="chat-sheet"
      >
        <span class="chat-pick-label" id="target-label">Chat</span>
        <span class="chat-pick-name" id="chat-pick-name">—</span>
      </button>
      <button
        type="button"
        class="ghost"
        id="btn-chat-new"
        title="New chat"
        aria-label="New chat"
      >+</button>
      <button type="button" class="ghost" id="btn-refresh" title="Refresh">↻</button>
      <select id="target-select" class="sr-only" tabindex="-1" aria-hidden="true"></select>
    </section>

    <main class="transcript" id="transcript" aria-live="polite">
      <p class="empty" id="transcript-empty">Pick a Cursor chat to see messages already loaded on the PC.</p>
    </main>

    <div
      class="layout-split"
      id="layout-split"
      role="separator"
      aria-orientation="horizontal"
      aria-valuemin="22"
      aria-valuemax="72"
      aria-valuenow="42"
      tabindex="0"
    ></div>

    <section class="bottom-dock" id="bottom-dock">
      <section class="composer" id="composer">
        <div class="composer-body" id="composer-body">
          <div class="composer-toolbar" id="composer-toolbar">
            <label class="composer-select-wrap">
              <span class="sr-only" id="mode-label">Mode</span>
              <select id="composer-mode" aria-labelledby="mode-label">
                <option value="agent">Agent</option>
                <option value="plan">Plan</option>
                <option value="ask">Ask</option>
                <option value="debug">Debug</option>
              </select>
            </label>
            <label class="composer-select-wrap composer-model-wrap">
              <span class="sr-only" id="model-label">Model</span>
              <span id="composer-model" class="composer-model-label" aria-labelledby="model-label">—</span>
            </label>
          </div>
          <div id="clarifications" class="clarifications hidden" aria-live="polite"></div>
          <label class="sr-only" id="composer-label" for="composer-input">Message</label>
          <div class="composer-shell">
            <textarea
              id="composer-input"
              rows="3"
              maxlength="20000"
              placeholder="Type a message…"
              enterkeyhint="send"
              autocomplete="off"
              autocorrect="on"
              autocapitalize="sentences"
            ></textarea>
            <div class="composer-footer">
              <span class="composer-hint" id="composer-hint">Type a message, then tap Send</span>
              <div class="composer-actions">
                <button
                  type="button"
                  class="mic-btn"
                  id="btn-mic"
                  title="Dictate"
                  aria-label="Dictate"
                  aria-pressed="false"
                >🎤</button>
                <button type="button" class="send-btn" id="btn-send" data-kind="send">Send</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="cards-dock" id="cards-dock" aria-label="Cards">
        <span class="busy hidden" id="busy-badge">Sending…</span>
        <div class="cards" id="cards"></div>
      </section>
    </section>

    <div
      id="chat-sheet"
      class="sheet hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="chat-sheet-title"
      hidden
    >
      <button type="button" class="sheet-backdrop" id="chat-sheet-backdrop" aria-label="Close"></button>
      <div class="sheet-panel">
        <div class="sheet-head">
          <h2 id="chat-sheet-title">Chats</h2>
          <button type="button" class="sheet-close" id="chat-sheet-close" aria-label="Close">✕</button>
        </div>
        <div class="sheet-tabs" role="tablist">
          <button type="button" class="sheet-tab active" id="tab-chats" role="tab" aria-selected="true">
            Open chats
          </button>
          <button type="button" class="sheet-tab" id="tab-new" role="tab" aria-selected="false">
            New chat
          </button>
        </div>
        <div class="sheet-body" id="sheet-chats" role="tabpanel"></div>
        <div class="sheet-body hidden" id="sheet-projects" role="tabpanel" hidden></div>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <div id="auth-gate" class="auth-gate hidden">
      <div class="auth-card">
        <h2 id="auth-title">Open from Settings QR</h2>
        <p id="auth-text">
          This page needs the secret from Keycode Settings → Phone remote.
          Scan the QR again, or paste the full link that ends with
          <code>#token=…</code>.
        </p>
      </div>
    </div>

    <script src="remote.js?v=20260905d"></script>
  </body>
</html>
