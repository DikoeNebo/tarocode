<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Keycode Eye</title>
    <style>
      html,
      body {
        margin: 0;
        width: 56px;
        height: 56px;
        overflow: hidden;
        background: transparent;
        -webkit-app-region: no-drag;
        user-select: none;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      button {
        width: 52px;
        height: 52px;
        margin: 2px;
        border: 1px solid rgba(255, 215, 140, 0.55);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #3a2a55 0%,
          #1a1228 70%,
          #0d0a14 100%
        );
        color: #ffe6a8;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55),
          inset 0 0 12px rgba(255, 200, 120, 0.12);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      button:hover {
        transform: scale(1.06);
        box-shadow: 0 6px 22px rgba(180, 120, 40, 0.35);
      }
      button.open {
        border-color: rgba(160, 255, 200, 0.6);
        color: #b8ffd4;
      }
      button.pinned {
        box-shadow: 0 0 0 2px rgba(232, 197, 122, 0.55),
          0 4px 18px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <button id="eye" title="Показать / скрыть (F9)" type="button">
      👁
    </button>
    <script src="eye.js"></script>
  </body>
</html>
