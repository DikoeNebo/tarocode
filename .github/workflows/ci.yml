name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check release assets
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build portable + installer
        run: npx electron-builder --win portable nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artefacts
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist-release -Filter "TaroCode-*-portable.exe" -ErrorAction SilentlyContinue
          if (-not $portable) { $portable = Get-ChildItem dist -Filter "TaroCode-*-portable.exe" -ErrorAction SilentlyContinue }
          $setup = Get-ChildItem dist-release -Filter "TaroCode-Setup-*.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { $setup = Get-ChildItem dist -Filter "TaroCode-Setup-*.exe" -ErrorAction SilentlyContinue }
          if (-not $portable) { throw "portable exe missing" }
          if (-not $setup) { throw "setup exe missing" }
          Get-FileHash $portable.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tarocode-windows
          path: |
            dist-release/TaroCode-*-portable.exe
            dist-release/TaroCode-Setup-*.exe
            dist/TaroCode-*-portable.exe
            dist/TaroCode-Setup-*.exe
          if-no-files-found: error
